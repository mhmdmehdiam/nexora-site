name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ------------------------------------------------------------------
  # Fast gate: types + unit tests. Fails in ~1 min, before any build.
  # ------------------------------------------------------------------
  verify:
    name: Types & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit --incremental false

      - name: Money calculation tests
        run: npx tsx scripts/test-money.ts

  # ------------------------------------------------------------------
  # Build + smoke test against a real PostgreSQL instance.
  # ------------------------------------------------------------------
  build-and-smoke:
    name: Build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_ci_pass
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexora:nexora_ci_pass@localhost:5432/nexora?schema=public
      JWT_SECRET: ci-only-secret-at-least-24-chars-long
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed demo data
        run: npx tsx prisma/seed.ts

      - name: Build
        run: npx next build

      - name: Start server
        run: |
          npx next start -p 3100 > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3100/api/health > /dev/null; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start" >&2
          cat /tmp/next.log
          exit 1

      - name: Health check
        run: |
          set -e
          BODY=$(curl -sf http://localhost:3100/api/health)
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
          echo "$BODY" | grep -q '"database":{"ok":true'

      - name: Landing page renders
        run: |
          set -e
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/)
          echo "GET / → $CODE"
          test "$CODE" = "200"

      - name: Login works end-to-end
        run: |
          set -e
          RESP=$(curl -s -X POST http://localhost:3100/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@nexora.ir","password":"admin123"}')
          echo "$RESP" | head -c 200
          echo
          echo "$RESP" | grep -q '"role":"owner"'

      - name: Authenticated API returns tenant data
        run: |
          set -e
          curl -s -c /tmp/cookies.txt -X POST http://localhost:3100/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ali@digiland.ir","password":"demo123"}' > /dev/null
          USERS=$(curl -sf -b /tmp/cookies.txt http://localhost:3100/api/users)
          echo "$USERS" | head -c 200
          echo
          echo "$USERS" | grep -q '"maxUsers"'

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== next server output ==="
          tail -200 /tmp/next.log 2>/dev/null || true

      - name: Stop server
        if: always()
        run: |
          kill "$(cat /tmp/next.pid)" 2>/dev/null || true
