# Nexora — production nginx config
#
# Place at /etc/nginx/sites-available/nexora and symlink into sites-enabled:
#   ln -s /etc/nginx/sites-available/nexora /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Then run deploy/setup-ssl.sh to obtain a Let's Encrypt certificate.
#
# Replace nexora.ir / www.nexora.ir with your real domain.

# ------------------------------------------------------------------
# Rate limiting zones
# ------------------------------------------------------------------
# Login/register: brute-force budget. The app also rate-limits per IP+email,
# but doing it here too stops the flood before it reaches Node.
limit_req_zone $binary_remote_addr zone=nexora_auth:10m rate=10r/m;
# General API: generous, but still bounded.
limit_req_zone $binary_remote_addr zone=nexora_api:10m rate=30r/s;

# Connection budget per IP
limit_conn_zone $binary_remote_addr zone=nexora_conn:10m;

# ------------------------------------------------------------------
# Upstream — the 4-worker cluster on :3100
# ------------------------------------------------------------------
upstream nexora_app {
    server 127.0.0.1:3100;
    keepalive 64;
}

# ------------------------------------------------------------------
# HTTP → HTTPS redirect (Certbot will also add its own block)
# ------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nexora.ir www.nexora.ir;

    # ACME challenge must stay on plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# HTTPS
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nexora.ir www.nexora.ir;

    # --- certificates (Certbot fills these in) ---
    ssl_certificate     /etc/letsencrypt/live/nexora.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexora.ir/privkey.pem;

    # --- TLS hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- security headers (the app sets its own too; these are defence in depth) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # --- body size (invoice/logo uploads) ---
    client_max_body_size 12m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # --- compression (the app compresses too; nginx handles static) ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/rss+xml font/truetype font/opentype
        application/vnd.ms-fontobject image/svg+xml;

    # --- connection budget ---
    limit_conn nexora_conn 40;

    # ================================================================
    # Static assets — immutable, cache for a year
    # ================================================================
    location /_next/static/ {
        proxy_pass http://nexora_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /favicon.ico {
        proxy_pass http://nexora_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        access_log off;
    }

    # ================================================================
    # Auth endpoints — strict rate limit
    # ================================================================
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=nexora_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://nexora_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    # ================================================================
    # Everything else — reverse proxy to the cluster
    # ================================================================
    location / {
        limit_req zone=nexora_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://nexora_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # SSE / streaming responses
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ================================================================
    # Health check — no rate limit, no logging noise
    # ================================================================
    location = /api/health {
        proxy_pass http://nexora_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ================================================================
    # Block common probes
    # ================================================================
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|sql|bak|log)$ {
        deny all;
        access_log off;
    }
}
